apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cas-server
  namespace: crypto-arena
  labels:
    app.kubernetes.io/name: cas-server
    app.kubernetes.io/part-of: cas
    release: kube-prom
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cas-server
  namespaceSelector:
    matchNames:
      - crypto-arena
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
