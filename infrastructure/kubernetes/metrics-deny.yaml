# A tiny "always 403" upstream used by the public Ingress to deny
# /metrics on the public api.* and play.* hosts.
#
# Why this exists: ingress-nginx's `nginx.ingress.kubernetes.io/server-snippet`
# annotation is silently ignored unless the controller is started with
# `allow-snippet-annotations: "true"`, which has been `false` by
# default since v1.9 (mid-2023). Rather than depend on a controller-
# level setting that an operator might not have flipped, we deny
# /metrics with a stock Ingress path rule whose backend always
# returns 403.
#
# In-cluster Prometheus continues to scrape /metrics by talking to
# the cas-server Service directly (port 8080), bypassing this Ingress.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cas-metrics-deny-conf
  namespace: crypto-arena
  labels:
    app.kubernetes.io/name: cas-metrics-deny
    app.kubernetes.io/part-of: cas
data:
  default.conf: |
    server {
      listen 8080;
      # Any path served by this pod returns 403. The Ingress only
      # routes /metrics here, so the catch-all is just defense in
      # depth in case the Ingress is ever misconfigured.
      location / {
        return 403 "forbidden\n";
      }
      # /healthz exists so the Deployment's readiness/liveness probes
      # can succeed without tripping the deny rule.
      location = /healthz {
        return 200 "ok\n";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cas-metrics-deny
  namespace: crypto-arena
  labels:
    app.kubernetes.io/name: cas-metrics-deny
    app.kubernetes.io/component: deny
    app.kubernetes.io/part-of: cas
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cas-metrics-deny
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cas-metrics-deny
        app.kubernetes.io/component: deny
        app.kubernetes.io/part-of: cas
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: conf
          configMap:
            name: cas-metrics-deny-conf
            items:
              - key: default.conf
                path: default.conf
---
apiVersion: v1
kind: Service
metadata:
  name: cas-metrics-deny
  namespace: crypto-arena
  labels:
    app.kubernetes.io/name: cas-metrics-deny
    app.kubernetes.io/part-of: cas
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cas-metrics-deny
  ports:
    - name: http
      port: 80
      targetPort: http
