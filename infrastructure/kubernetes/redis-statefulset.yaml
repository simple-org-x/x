apiVersion: v1
kind: Service
metadata:
  name: cas-redis
  namespace: crypto-arena
  labels:
    app.kubernetes.io/name: cas-redis
    app.kubernetes.io/part-of: cas
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cas-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cas-redis
  namespace: crypto-arena
  labels:
    app.kubernetes.io/name: cas-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: cas
spec:
  serviceName: cas-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cas-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cas-redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: cas
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
