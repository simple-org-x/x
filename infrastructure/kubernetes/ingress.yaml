apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cas-ingress
  namespace: crypto-arena
  labels:
    app.kubernetes.io/name: cas-ingress
    app.kubernetes.io/part-of: cas
  annotations:
    # Cloudflare-friendly defaults: terminate TLS at the edge, force
    # https on the origin, and let cert-manager mint the origin cert.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    # Cloudflare passes the real client IP via CF-Connecting-IP; nginx
    # reads it through a real-ip snippet provided by the controller.
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    # /metrics is unauthenticated and meant for in-cluster scrape only
    # (a Prometheus ServiceMonitor handles it directly via the cas-server
    # Service). Deny it explicitly on the public api.* host so probes
    # against api.crypto-arena.example.com/metrics get a 403 without
    # ever reaching the upstream pod.
    nginx.ingress.kubernetes.io/server-snippet: |
      location = /metrics {
        return 403;
      }
      location ^~ /metrics/ {
        return 403;
      }
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - play.crypto-arena.example.com
        - api.crypto-arena.example.com
      secretName: cas-tls
  rules:
    - host: play.crypto-arena.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cas-client
                port:
                  number: 80
    - host: api.crypto-arena.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cas-server
                port:
                  number: 8080
