apiVersion: v1
kind: Service
metadata:
  name: cas-postgres
  namespace: crypto-arena
  labels:
    app.kubernetes.io/name: cas-postgres
    app.kubernetes.io/part-of: cas
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cas-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cas-postgres
  namespace: crypto-arena
  labels:
    app.kubernetes.io/name: cas-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cas
spec:
  serviceName: cas-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cas-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cas-postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: cas
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: cas
            - name: POSTGRES_USER
              value: cas
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cas-postgres-secret
                  key: password
                  optional: true
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "cas", "-d", "cas"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "cas", "-d", "cas"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
