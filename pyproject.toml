[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tidy-cli"
version = "0.1.0"
description = "A smart, zero-dependency CLI to organize messy folders by file type."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["cli", "files", "organizer", "automation", "downloads"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.scripts]
tidy = "tidy.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/tidy-cli"
Issues = "https://github.com/YOUR_USERNAME/tidy-cli/issues"
Sponsor = "https://github.com/sponsors/YOUR_USERNAME"

[tool.setuptools.packages.find]
include = ["tidy*"]
