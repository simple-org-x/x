server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed Vite assets; index.html itself stays fresh.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: every non-asset path resolves to index.html so the
    # React router can handle deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check for the docker-compose / k8s liveness probe.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
